# Two co-located vLLM instances on one DGX Spark (GB10, unified 128 GB).
#
# MEMORY SPLIT -- the number that matters:
#   commander --gpu-memory-utilization 0.55   ~70 GB
#   grunt     --gpu-memory-utilization 0.28   ~36 GB
#                                     ------  ------
#                                       0.83  ~106 GB, leaving ~21 GB for the OS, page
#                                             cache, container runtime and orchestrator.
#
# `--gpu-memory-utilization` is a PER-INSTANCE fraction of TOTAL device memory, not of
# free memory. That is not folklore -- it is what this build's own help text says:
#
#   "This is a per-instance limit, and only applies to the current vLLM instance. It
#    does not matter if you have another vLLM instance running on the same GPU. For
#    example, if you have two vLLM instances running on the same GPU, you can set the
#    GPU memory utilization to 0.5 for each instance."
#
# The default is 0.92, and NVIDIA's own release notes call that out as the cause of OOM
# on unified-memory systems (DGX Spark, Jetson). Neither instance is allowed to
# autodetect here; both fractions are explicit, which is the documented fix.
#
# Startup order is not cosmetic. vLLM has a known memory-accounting issue when a second
# instance starts while another is still profiling (vllm-project/vllm#10643), so the
# grunt service waits on the commander's healthcheck. Start the big model first, always.
#
# --- image facts, verified by inspecting the pulled image (2026-08-11) ---------------
#   nvcr.io/nvidia/vllm:26.07-py3   arm64
#   vLLM 0.24.0+092c4842.dev, torch 2.13.0a0, CUDA 13.3.1
#   ENTRYPOINT = /opt/nvidia/nvidia_entrypoint.sh, CMD = null
#
# That entrypoint is the generic NGC wrapper: it execs "$@" and nothing more. Unlike
# upstream `vllm/vllm-openai`, whose ENTRYPOINT *is* `vllm serve`, the command below
# must therefore start with `vllm serve` itself. Passing bare flags here gets you an
# exec failure, not a server.
#
# There is deliberately no `runtime: nvidia`: this host registers only `runc` and
# `io.containerd.runc.v2`. GPU access comes through the device reservation below (the
# Compose spelling of `--gpus all`), which is verified working -- a container started
# this way reports compute capability (12, 1).
#
# The ${...} values come from deploy/commander.env and deploy/grunt.env, which the
# Makefile passes as --env-file so Compose can interpolate them here. Run this file
# through the Makefile (`make up`), not with a bare `docker compose up`, or the
# substitutions will be empty.

name: soc-poc

x-vllm-common: &vllm-common
  image: nvcr.io/nvidia/vllm:26.07-py3
  ipc: host
  shm_size: "8gb"
  # Bounded, not unless-stopped: a memory misconfiguration fails at engine init, and an
  # unbounded restart policy turns that into a silent crash loop that looks like a slow
  # load. Three tries, then it stays down and `make ps` shows you.
  restart: on-failure:3
  volumes:
    # Model weights are large; share one cache between both services. Populate it with
    # `make weights` BEFORE `make up` -- see the Makefile for why that matters.
    - ${HF_CACHE_DIR}:/root/.cache/huggingface
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  commander:
    <<: *vllm-common
    container_name: soc-poc-commander
    env_file: commander.env
    ports:
      - "8000:8000"
    command: >
      vllm serve ${COMMANDER_MODEL}
      --served-model-name ${COMMANDER_SERVED_NAME}
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization ${COMMANDER_GPU_FRACTION}
      --max-model-len ${COMMANDER_MAX_MODEL_LEN}
      --max-num-seqs ${COMMANDER_MAX_NUM_SEQS}
      --structured-outputs-config.backend ${COMMANDER_STRUCTURED_OUTPUT_BACKEND}
      ${COMMANDER_EXTRA_ARGS}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      # ~62 GB of weights over ~273 GB/s, plus torch.compile warmup on first boot. This
      # window assumes `make weights` already populated the cache; a cold download would
      # blow through it and leave the grunt service waiting forever on an unhealthy
      # commander.
      retries: 90
      start_period: 900s

  grunt:
    <<: *vllm-common
    container_name: soc-poc-grunt
    env_file: grunt.env
    ports:
      - "8001:8001"
    depends_on:
      commander:
        condition: service_healthy
    # ONE instance serves the whole grunt fleet. Concurrent tasks are handled by
    # continuous batching inside this server; spawning an instance per agent would
    # duplicate the weights and shred the memory budget for no throughput gain.
    command: >
      vllm serve ${GRUNT_MODEL}
      --served-model-name ${GRUNT_SERVED_NAME}
      --host 0.0.0.0
      --port 8001
      --gpu-memory-utilization ${GRUNT_GPU_FRACTION}
      --max-model-len ${GRUNT_MAX_MODEL_LEN}
      --max-num-seqs ${GRUNT_MAX_NUM_SEQS}
      --structured-outputs-config.backend ${GRUNT_STRUCTURED_OUTPUT_BACKEND}
      ${GRUNT_EXTRA_ARGS}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 300s
