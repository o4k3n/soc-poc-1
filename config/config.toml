# SOC PoC configuration.
#
# Everything the orchestrator needs to reach a model lives here. Swapping the
# commander or grunt model is a config edit, never a code edit.
#
# NOTE: the *serving-side* memory fractions are NOT here on purpose -- they live in
# deploy/commander.env and deploy/grunt.env, which are the single source of truth for
# how the two vLLM instances carve up the Spark's unified pool. Duplicating them here
# would create two places to be wrong. See README "Memory split".

[run]
output_dir = "out"
# Hard cap on INVESTIGATING -> EXECUTING cycles: the number of questions the commander
# may ask. Reaching it is not an error -- the orchestrator still synthesizes a brief
# from the evidence gathered, and the brief is told to record the cap as a coverage gap.
#
# This was 3 when it counted drill-down ROUNDS on top of a sweep that had already read
# everything. It now counts individual questions, and three questions is not an
# investigation. Most of them are searches costing milliseconds; the cost is the
# commander turn around each one, so this is a ceiling and not a target -- a run that
# has what it needs ends early with `conclude`.
max_iterations = 24
# Floor on steps before `conclude` is honoured. The first real run of the action loop
# concluded at step 2 of 24 -- and then listed five unexamined avenues in coverage_gaps,
# including "search for the domain across all hosts was not executed". It knew. Being
# told the budget is available is not the same as being told an unspent step is worth
# nothing, so a premature conclude is now rejected once with the questions still open.
min_steps_before_conclude = 6
# In-flight grunt tasks. Only close_read dispatches a worker and it does so one at a
# time, so this no longer gates a fleet; it is kept as a bound on the client side.
max_concurrent_grunts = 8
# Tokens of the grunt's context reserved for the slice itself. See src/soc_poc/chunking.py.
slice_token_budget = 10000
# Pessimistic chars-per-token for log lines, measured against the Qwen3 tokenizer on
# high-entropy DNS labels. Lower is safer.
chars_per_token = 1.4
# Grunts are re-prompted exactly once with the validation error, then give up and
# return an explicit failure record.
max_validation_retries = 1

[models.commander]
role = "commander"
base_url = "http://127.0.0.1:8000/v1"
# Must match --served-model-name in deploy/commander.env. health_check.py asserts this.
model = "gpt-oss-120b"
api_key = "EMPTY"          # vLLM ignores the value but the OpenAI client shape wants one
temperature = 0.2
top_p = 0.95
max_tokens = 6144
request_timeout_s = 900.0  # latency is explicitly a non-goal on this box
# Extra body merged into every request to this model (vLLM-specific knobs).
extra_body = {}

# --- Alternative commander: Qwen3.8-27B ---------------------------------------------
# Measured from the repo's own config.json, not from the model card:
#
#   weights            55.6 GB, 18 BF16 safetensors (the "17 GB" figure circulating is a
#                      4-bit community build, not Qwen/Qwen3.8-27B)
#   architecture       Qwen3_5ForConditionalGeneration, dense, 64 layers
#   context            262,144 native (the card claims 1M with extension)
#   multimodal         image-text-to-text, ships a video preprocessor. We send text only,
#                      so the vision tower is inert weight -- a cost, not a feature.
#   vLLM support       PRESENT in 0.24.0, which is what the NGC 26.07 image ships. Checked
#                      against the v0.24.0 tag, not main. This was the gating risk.
#
# KV is the expensive part: head_dim 256 x 64 layers x 4 KV heads = 256 KiB/token at BF16,
# 128 KiB at FP8. So the advertised context is not purchasable --
#
#     context     KV BF16    KV FP8
#      32,768        8.0G      4.0G
#     131,072       32.0G     16.0G
#     262,144       64.0G     32.0G     <- KV alone, before weights
#
# 131072 with --kv-cache-dtype fp8 lands around 70 GiB all-in against a 121 GB pool. That
# is the point of the swap: 5x the current 24,384, which lets evidence.py stop collapsing
# older steps (STEPS_RENDERED_IN_FULL) -- the collapse is why one graded run searched
# dhcp.log three separate times for the same address.
#
# Trial sequence, and do not skip the middle step:
#   1. make weights-qwen38   (~56 GB; separate target, never pulled by `make weights`)
#   2. swap the blocks below and in deploy/commander.env
#   3. make restart-commander
#   4. make health           <- the arbiter. Benchmarks say nothing about whether xgrammar
#                               constrains this model; gpt-oss silently ignored the grammar
#                               on tool-menu-shaped prompts and returned 200 the whole time.
#   5. ./analyze.py cases/dns-tunnel --yes && make grade RUN=out/<id>
#      Baseline to beat: inv-greploop-07, 7/7 ground-truth items, 0 decoy false positives.
#
# [models.commander]
# role = "commander"
# base_url = "http://127.0.0.1:8000/v1"
# model = "qwen3.8-27b"
# api_key = "EMPTY"
# temperature = 0.2
# top_p = 0.95
# max_tokens = 6144
# request_timeout_s = 900.0
# extra_body = {}

# --- Fallback commander -------------------------------------------------------------
# The seam that makes the commander model disposable. If gpt-oss-120b fails to load, OOMs
# against its memory fraction, or fails the guided-JSON check in `make health`, comment
# out [models.commander] above, uncomment this block, and override
# COMMANDER_MODEL/COMMANDER_SERVED_NAME in deploy/commander.env. The commander's contract
# is a JSON schema; nothing in the orchestrator knows which model satisfies it.
#
# [models.commander]
# role = "commander"
# base_url = "http://127.0.0.1:8000/v1"
# model = "qwen3-32b-fp8"
# api_key = "EMPTY"
# temperature = 0.2
# top_p = 0.95
# max_tokens = 6144
# request_timeout_s = 900.0
# extra_body = { chat_template_kwargs = { enable_thinking = false } }

[models.grunt]
role = "grunt"
base_url = "http://127.0.0.1:8001/v1"
# Must match --served-model-name in deploy/grunt.env.
model = "qwen3-8b"
api_key = "EMPTY"
temperature = 0.1
top_p = 0.9
# Measured, not guessed: across 112 successful sweep reports the median completion was
# 313 tokens, p99 971, maximum 1125. 1400 leaves 25% headroom over the worst real report.
#
# The cap is a cost control, not a size limit. Guided decoding occasionally sends a small
# model into a whitespace loop -- in the 83-slice run, 22 replies ran to the old 3072-token
# ceiling emitting indentation (92% whitespace in the sample), each taking ~330s against a
# 39s median, and all 22 were rejected. That single pathology burned 57% of all grunt
# compute. A lower ceiling makes the failure cheap and fast; the real cure is
# --structured-outputs-config.disable_any_whitespace on the grunt server.
max_tokens = 1400
request_timeout_s = 600.0
# Qwen3 is a hybrid-reasoning model. Thinking blocks fight with guided decoding, so we
# turn them off at the request level. VERIFY against your pinned vLLM/Qwen chat
# template: if the template ignores this kwarg, serve with
# --structured-outputs-config.enable_in_reasoning instead.
extra_body = { chat_template_kwargs = { enable_thinking = false } }

# Stubbed seam for a future cloud frontier judge. Nothing reads this yet beyond the
# config loader; it exists so the eval harness has a place to plug in without a
# refactor. Never enable it against real customer logs without a data-egress review.
[models.evaluator]
role = "evaluator"
enabled = false
base_url = "https://api.example-frontier-judge.invalid/v1"
model = "unset"
api_key = "env:EVALUATOR_API_KEY"
temperature = 0.0
top_p = 1.0
max_tokens = 4096
request_timeout_s = 300.0
extra_body = {}

[structured_output]
# How the JSON schema is attached to a request.
#   "response_format"    -> OpenAI-compatible {"type": "json_schema", ...}   (portable)
#   "structured_outputs" -> vLLM-native extra_body.structured_outputs.json  (native)
# The deprecated `guided_json` spelling is deliberately not offered.
mode = "response_format"
# Ask vLLM to reject rather than silently truncate a schema it cannot compile.
strict = true

[fixtures]
alert = "fixtures/alert.json"
logs_dir = "fixtures/logs"
